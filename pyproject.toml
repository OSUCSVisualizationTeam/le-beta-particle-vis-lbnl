[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "le-beta-vis-lbnl"
version = "0.1.0"
description = "Interactive desktop tool for visualizing and classifying low-energy beta particle tracks in CCD sensor data — built for LBNL's Applied Nuclear Physics program."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "astropy",
    "h5py>=3.10",
    "matplotlib",
    "mlccd-diffusion",
    "mlccd-models",
    "mysql-connector-python",
    "numpy<2",
    "opencv-python",
    "pyqtgraph",
    "pyside6",
    "python-dotenv",
    "pyyaml",
    "pyzmq",
    "scikit-image",
    "scipy",
    "superqt",
    "jsonschema",
    "tomli; python_version < '3.11'",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "autopep8",
    "coverage",
    "docformatter[tomli]",
    "flake8",
    "flake8-pyproject",
    "pre-commit",
    "pytest",
]
packaging = [
    "dmgbuild; sys_platform == 'darwin'",
    "pillow",
    "pyinstaller",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/OSUCSVisualizationTeam/le-beta-particle-vis-lbnl"

[project.scripts]
lbnlvis = "le_beta_vis.app:main"

[tool.uv.sources]
mlccd-diffusion = { git = "https://gitlab.com/lbl-anp/mlccd/mlccd_diffusion.git" }
mlccd-models = { git = "https://gitlab.com/lbl-anp/mlccd/mlccd_models.git" }

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
le_beta_vis = [
    "backend/SAMPLE.env",
    "config/*.yaml",
    "resources/icons/*.png",
    "resources/icons/*.svg",
    "resources/icons/LICENSE_MATERIAL_SYMBOLS",
    "resources/images/*.png",
    "resources/qss/**/*.qss",
    "export/fonts/*.ttf",
    "export/fonts/LICENSE_DEJAVU",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 127
max-complexity = 10
# Note: The workflow's first step selects specific fatal errors (E9, F63, F7, F82).
# We do not use 'select' here so that IDEs show all warnings (matching the
# second step of the workflow) rather than hiding standard style issues.
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".env",
    "venv",
    "env",
    ".venv",
    ".idea",
    ".vscode",
    ".github",
]

[tool.autopep8]
max-line-length = 127
in-place = true
aggressive = 1

[tool.docformatter]
syntax = "google"
wrap-summaries = 127
wrap-descriptions = 127
in-place = true
