[project]
name = "le-beta-vis-lbnl"
version = "0.0.2"
description = "Interactive desktop tool for visualizing and classifying low-energy beta particle tracks in CCD sensor data — built for LBNL's Applied Nuclear Physics program."

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lbnlvis = "le_beta_vis.app:main"

[tool.flake8]
max-line-length = 127
max-complexity = 10
# Note: The workflow's first step selects specific fatal errors (E9, F63, F7, F82).
# We do not use 'select' here so that IDEs show all warnings (matching the
# second step of the workflow) rather than hiding standard style issues.
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".env",
    "venv",
    "env",
    ".venv",
    ".idea",
    ".vscode",
    ".github",
]

[tool.autopep8]
max-line-length = 127
in-place = true
aggressive = 1

[tool.docformatter]
syntax = "google"
wrap-summaries = 127
wrap-descriptions = 127
in-place = true
