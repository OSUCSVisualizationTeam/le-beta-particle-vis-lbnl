name: Python Package (UV)

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
    env:
      DB_USER: root
      DB_PASS: root
      DB_NAME: lbnlfits
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Start MySQL
        run: sudo service mysql start

      - name: Create database
        run: |
          echo "Creating database ${DB_NAME}"
          echo " User: ${DB_USER}"
          mysql -u $DB_USER --password=$DB_PASS --port=3306 --host=127.0.0.1 -e "CREATE DATABASE ${DB_NAME};"

      - name: Create schema
        run: |
          mysql -u $DB_USER --password=$DB_PASS --port=3306 --host=127.0.0.1 --database=$DB_NAME < src/le_beta_vis/backend/eventPersistence.sql

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Install system dependencies
        run: |
          apt-get update -qq || sudo apt-get update -qq
          apt-get install -y -qq libgl1 libegl1 || sudo apt-get install -y -qq libgl1 libegl1

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=archive,.venv,.packaging-venv
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=archive,.venv,.packaging-venv

      - name: Test with pytest
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest --ignore=tests/test_MagnifierGraphicsItem.py --ignore=tests/test_CaptureGraphicsView.py --ignore=tests/test_SectionHeaderFormatting.py --ignore=tests/test_VerticalRangeControlUI.py --ignore=tests/test_HUDBoxSelectionItem.py --ignore=tests/test_HUDMagnifierBorderItem.py --ignore=tests/test_HDUVisualizationHUDWidget.py --ignore=tests/test_DragHandleLifetimeUI.py --ignore=tests/test_live_ipc_fallback.py --ignore=tests/test_live_eventrepository_dispatcher.py tests
