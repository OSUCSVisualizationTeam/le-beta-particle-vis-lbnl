# defaults.yaml — Structured configuration metadata registry
#
# Each key carries its type, default value, and human-readable description.
# The YAMLBackedConfigurationService reads this to bootstrap new user configs.
# The wiki Configuration-Keys.md is synced from this file.

# ---------------------------------------------------------------------------
# Global / Infrastructure
# ---------------------------------------------------------------------------

global:db:hostname:
  type: str
  default: "localhost"
  description: >-
    Database host for the Event Persistence Service.

global:db:database:
  type: str
  default: "lbnlfits"
  description: >-
    Database name for the Event Persistence Service.

global:db:username:
  type: str
  default: "root"
  description: >-
    Username for database connection.

global:db:password:
  type: str
  default: "root"
  description: >-
    Password for database connection.

global:physics:kev_conversion:
  type: float
  default: 1.02857e-5
  description: >-
    Constant factor to convert raw charge values (ADU) to energy (keV).
    Depends on sensor hardware.

global:physics:ped_width:
  type: int
  default: 1400
  description: >-
    Pedestal width (background noise level in ADU) used as the base
    for sigma-threshold clustering.

# ---------------------------------------------------------------------------
# GUI — Raw Analysis
# ---------------------------------------------------------------------------

gui:raw_analysis:default_colormap:
  type: enum
  choices: ["viridis", "plasma", "inferno", "magma", "jet", "bone", "hot", "cool", "grayscale"]
  default: "viridis"
  description: >-
    Initial colormap applied when opening a new FITS file.
    Supported: viridis, plasma, inferno, magma, jet, bone, hot, cool, grayscale.

gui:raw_analysis:default_scaling_function:
  type: enum
  choices: ["linear", "log", "sqrt"]
  default: "linear"
  description: >-
    Transfer function applied when rendering the main Raw Data View.
    Values: linear, log, sqrt.

gui:raw_analysis:vis_range_min:
  type: float
  default: 0.0
  description: >-
    Lower bound (in keV) for visualization thresholding.
    Values below this are clipped.

gui:raw_analysis:vis_range_max:
  type: float
  default: 20.0
  description: >-
    Upper bound (in keV) for visualization thresholding.
    Values above this are clipped or normalized.

gui:raw_analysis:filter_gaussian_sigma:
  type: float
  default: 1.5
  description: >-
    Sigma (radius) value for the interactive Gaussian blur filter.

gui:raw_analysis:clustering_threshold:
  type: float
  default: 4.0
  description: >-
    Signal-to-noise ratio (sigma multiplier) used for identifying
    event clusters.

gui:raw_analysis:cluster_extractor_method:
  type: enum
  choices: ["mock", "lbnl_classical", "lbnl_optimized", "general"]
  default: "lbnl_classical"
  description: >-
    Backend algorithm for cluster extraction.
    Values: mock, lbnl_classical, lbnl_optimized, general.

gui:raw_analysis:clustering_timeout_seconds:
  type: int
  default: 300
  description: >-
    Maximum time (in seconds) before a running cluster extraction
    is aborted. A warning dialog is shown on timeout.

gui:raw_analysis:zoom_step_factor:
  type: float
  default: 1.2
  description: >-
    Factor to multiply/divide scale by when zooming in or out.

gui:raw_analysis:magnifier_display_size:
  type: int
  default: 127
  description: >-
    Fixed side length (in pixels) of the square magnifier overlay.

gui:raw_analysis:magnifier_default_factor:
  type: float
  default: 3.0
  description: >-
    Initial magnification factor when the magnifier tool is activated.

gui:raw_analysis:magnifier_min_factor:
  type: float
  default: 1.0
  description: >-
    Minimum allowed magnification factor for the magnifier tool.

gui:raw_analysis:magnifier_max_factor:
  type: float
  default: 100.0
  description: >-
    Maximum allowed magnification factor for the magnifier tool.

gui:raw_analysis:magnifier_factor_step:
  type: float
  default: 0.5
  description: >-
    Increment/decrement step when adjusting magnification
    via scroll wheel or keyboard.

gui:raw_analysis:magnifier_info_label_font_size:
  type: float
  default: 1.0
  description: >-
    Multiplier applied to the magnifier info label's font size
    (Min/Max/Val/Zoom panel and hint text). Range: 0.5-2.0.

gui:raw_analysis:magnifier_move_step:
  type: int
  default: 1
  description: >-
    Pixel step size when moving the magnifier with arrow keys.

gui:raw_analysis:show_tool_hints:
  type: bool
  default: true
  description: >-
    Show inline usage hints on interactive tools
    (e.g., magnifier keyboard shortcuts).

gui:raw_analysis:box_select_color:
  type: str
  default: "#00BFFF"
  description: >-
    CSS color for the box selection ROI rectangle border and fill.

gui:raw_analysis:box_select_border_width:
  type: int
  default: 2
  description: >-
    Border width (in pixels) for the box selection ROI rectangle.

gui:raw_analysis:cluster_thumbnail_use_colormap:
  type: bool
  default: true
  description: >-
    When enabled, cluster thumbnails use the active colormap
    via OpenCVBasedConverter instead of grayscale.

gui:raw_analysis:auto_range_on_load:
  type: bool
  default: false
  description: >-
    When true, automatically set the visualization range to the full data
    extent each time a new HDU is rendered. When false, the range stays at
    the user's last selection or the config defaults.

gui:raw_analysis:display_energy_in_kev:
  type: bool
  default: true
  description: >-
    Display cluster energy in keV. When false, displays raw ADU values.

gui:raw_analysis:show_low_confidence_annotations:
  type: bool
  default: true
  description: >-
    Show persistent cluster annotation overlays for clusters whose best
    classification score is below annotation_classification_threshold.
    When false, those low-confidence/unclassified annotations are hidden.

gui:raw_analysis:annotation_classification_threshold:
  type: float
  default: 0.5
  description: >-
    Minimum confidence (across cnn, nrg, and bdt scores) for a persistent
    cluster annotation to be considered classified, used to gate
    show_low_confidence_annotations.

# ---------------------------------------------------------------------------
# GUI — Window
# ---------------------------------------------------------------------------

gui:window:default_width:
  type: int
  default: 1024
  description: >-
    Default initial width of the application window.

gui:window:default_height:
  type: int
  default: 700
  description: >-
    Default initial height of the application window.

gui:window:status_bar_clear_timeout_s:
  type: int
  default: 5
  description: >-
    Seconds after which a stale status-bar message is automatically
    cleared. Set to 0 to disable auto-clear. Active progress
    indicators are unaffected.

# ---------------------------------------------------------------------------
# GUI — Mosaic
# ---------------------------------------------------------------------------

gui:mosaic:height:
  type: int
  default: 130
  description: >-
    Fixed height (in pixels) of the Mosaic View container strip.

gui:mosaic:thumbnail_height:
  type: int
  default: 100
  description: >-
    Height (in pixels) of the individual thumbnail images
    inside the strip. Width is calculated dynamically.

gui:mosaic:scaling_function:
  type: enum
  choices: ["linear", "log", "sqrt"]
  default: "log"
  description: >-
    Transfer function used to render thumbnails.
    Values: linear, log, sqrt.

# ---------------------------------------------------------------------------
# GUI — Historical Event Analysis
# ---------------------------------------------------------------------------

gui:historical:default_time_preset:
  type: enum
  choices: ["all", "24h", "3d", "7d", "30d"]
  default: "all"
  description: >-
    Default time-range preset selected when opening the Historical
    Analysis view. "all" disables the date filter entirely. The
    windowed presets resolve to a [now-window, now] range each
    time they are applied.

gui:historical:classification_threshold:
  type: float
  default: 0.75
  description: >-
    Min confidence for positive classification in the
    Historical Analysis grid and inspector.

gui:historical:roi_padding_factor:
  type: float
  default: 2.0
  description: >-
    Multiplier applied to a cluster's bounding box when the
    Historical Inspector "Open in Raw Data" action drops an
    ROI rectangle in the Raw Data Analysis tab. A factor of
    2.0 produces a box twice the cluster geometry, centered
    on the cluster.

gui:historical:grid_item_width:
  type: int
  default: 140
  description: >-
    Width (in pixels) of each event thumbnail cell
    in the Historical Analysis grid.

gui:historical:grid_item_height:
  type: int
  default: 160
  description: >-
    Height (in pixels) of each event thumbnail cell
    in the Historical Analysis grid.

gui:historical:grid_default_columns:
  type: int
  default: 2
  description: >-
    Default number of visible columns in the event grid.

gui:historical:grid_max_columns:
  type: int
  default: 3
  description: >-
    Maximum number of visible columns in the event grid.

gui:historical:thumbnail_colormap:
  type: enum
  choices: ["viridis", "plasma", "inferno", "magma", "jet", "bone", "hot", "cool", "grayscale"]
  default: "viridis"
  description: >-
    Colormap used for event grid thumbnail rendering.

gui:historical:eviction_distance:
  type: int
  default: 30
  description: >-
    Number of rows beyond the visible viewport before cached
    thumbnails are evicted.

gui:historical:scroll_prefetch_buffer:
  type: int
  default: 30
  description: >-
    Number of items to pre-fetch beyond the visible viewport on
    each side during scroll.  Keeps thumbnails ready before items
    scroll into view.  Matches eviction_distance so pre-fetched
    items are never immediately evicted.

gui:historical:fits_cache_idle_seconds:
  type: int
  default: 60
  description: >-
    Seconds of scroll inactivity before the cached FITS HDU array
    is released from memory. Minimum enforced: 60.

gui:historical:thumbnail_max_workers:
  type: int
  default: 2
  description: >-
    Number of worker threads for async thumbnail generation.
    Minimum enforced: 2.

gui:historical:prefetch_thumbnail_count:
  type: int
  default: 30
  description: >-
    Number of thumbnails to pre-fetch eagerly on initial load
    before scroll events are available.

gui:historical:grid_section_header_height:
  type: int
  default: 48
  description: >-
    Height (in pixels) of section header labels in the Historical
    Analysis event grid.  Headers display navigation buttons,
    the observation date, and source FITS filename.

gui:historical:thumbnail_smooth_scaling:
  type: bool
  default: false
  description: >-
    Enable smooth (anti-aliased) scaling for event grid thumbnails.
    When false, nearest-neighbor interpolation preserves pixel
    boundaries.

# ---------------------------------------------------------------------------
# GUI — Inspector
# ---------------------------------------------------------------------------

gui:inspector:histogram_bins:
  type: int
  default: 50
  description: >-
    Number of bins to use when generating energy distribution
    histograms for selected events.

# ---------------------------------------------------------------------------
# GUI — Export
# ---------------------------------------------------------------------------

gui:export:default_path:
  type: directory_path
  default: "~"
  description: >-
    Default directory presented in the "Save As" dialog. The filename is
    generated automatically as mlccd-export-YYYYMMDD-HHMMSS.

gui:export:image_format:
  type: str
  default: "png"
  description: >-
    Preferred file format for exporting plots and images.

gui:export:max_time_window_days:
  type: int
  default: 30
  description: >-
    Maximum time-range window (in days) allowed for an export when the
    Historical filter time preset is not 'all'. Exports exceeding this
    window are blocked to protect scientists from accidentally pulling
    multi-month result sets. See issue #56.

gui:export:cluster_png_colormap:
  type: str
  default: "viridis"
  description: >-
    Colormap applied to cluster card PNGs embedded inside the .h5
    export under /clusterCards. Must match a value of the Colormap
    enum ('viridis', 'plasma', 'inferno', 'magma', 'jet', 'bone',
    'hot', 'cool', 'grayscale'). Unknown values fall back to 'viridis'.
    See issue #56.

gui:export:png_render_workers:
  type: int
  default: 4
  description: >-
    Number of parallel worker threads used to render per-cluster cluster card
    PNGs during export. Clamped to [2, 16]. Increase on machines with many CPU
    cores to speed up large exports. See issue #56.

gui:export:progress_weight_fits:
  type: float
  default: 0.70
  description: >-
    Fraction of the overall export progress bar assigned to the FITS
    hydration stage. The export bar aggregates the three measurable
    stages (fits, h5, png) into one continuous 0-100% sweep; each
    weight is the size of that stage's slice. The three weights must
    sum to 1.0 (they are renormalised at read time if they don't).

gui:export:progress_weight_h5:
  type: float
  default: 0.10
  description: >-
    Fraction of the overall export progress bar assigned to the HDF5
    write stage. See gui:export:progress_weight_fits.

gui:export:progress_weight_png:
  type: float
  default: 0.20
  description: >-
    Fraction of the overall export progress bar assigned to the cluster
    card PNG stage. Lowered from an equal split because the DirectPNG
    renderer is ~5-10x faster than the previous matplotlib renderer.
    See gui:export:progress_weight_fits.

# ---------------------------------------------------------------------------
# Pipeline
# ---------------------------------------------------------------------------

pipeline:ingress:polling_location:
  type: directory_path
  default: "~/Google\\ Drive\\/My\\ Drive/FITS"
  description: >-
    File path on local system to poll for new FITS data.

pipeline:ingress:stability_poll_interval_ms:
  type: int
  default: 500
  description: >-
    Delay in milliseconds between consecutive file-size polls used to
    detect whether a newly-created file in the polling location has
    finished being written before ingestion processes it. Guards against
    watcher backends (notably Windows' ReadDirectoryChangesW) that report
    a file as created before the writer has finished and closed it.

pipeline:ingress:stability_max_wait_ms:
  type: int
  default: 30000
  description: >-
    Maximum total time in milliseconds to wait for a newly-detected
    file's size to stop changing across two consecutive polls. If
    exceeded, the file is logged and skipped, not processed or retried.

pipeline:ingress:process_file_timeout_seconds:
  type: int
  default: 120
  description: >-
    Defense-in-depth timeout in seconds for a single process_file() call.
    Guards against corrupted files, AV locks, or other unknowns that
    survive the stability check. The blocked worker thread may not be
    forcibly cancellable and can remain alive after a timeout; ingestion
    moves on to the next queued file regardless.

# ---------------------------------------------------------------------------
# Event Persistence Service (EPS)
# ---------------------------------------------------------------------------

eps:cluster_ipc:
  type: str
  default: "ipc:///tmp/EPCCluster.ipc"
  description: >-
    ZMQ IPC address for the EPS cluster socket.

eps:fits_ipc:
  type: str
  default: "ipc:///tmp/EPCFits.ipc"
  description: >-
    ZMQ IPC address for the EPS FITS socket.

eps:command_ipc:
  type: str
  default: "ipc:///tmp/EPCCommand.ipc"
  description: >-
    ZMQ IPC address for the EPS command socket.

eps:timeout_ms:
  type: int
  default: 5000
  description: >-
    Timeout in milliseconds for ZMQ send/receive operations
    against the EPS.

eps:retrieval_limit_default:
  type: int
  default: 500
  description: >-
    Default `limit` applied to PagedRetrieval cluster queries when the
    client does not supply one. Should be injected by every paged
    cluster-retrieval call site (overridable per call).

eps:retrieval_limit_max:
  type: int
  default: 2000
  description: >-
    Server-side hard cap for PagedRetrieval cluster queries. Requests
    with a `limit` <= 0 or > this value are rejected, closing the
    unbounded-result crash path regardless of client input.

eps:cluster_storage_buffer_size:
  type: int
  default: 32
  description: >-
    Number of Cluster objects the client-side ClusterStorageBuffer
    accumulates in FileProcessing before flushing them to the EPS
    BulkStorage action in a single ZMQ round-trip / multi-row INSERT.
    Bounded to [16, 2000] via ConfigurationService.get_int.

# ---------------------------------------------------------------------------
# Event Handler (pub/sub bus)
# ---------------------------------------------------------------------------

event_handler:zmq_pub_endpoint:
  type: str
  default: "ipc:///tmp/EPCEvents.ipc"
  description: >-
    ZMQ IPC address for the EventHandler PUB/SUB bus.  The EPS
    binds this endpoint and publishes envelopes; the frontend
    connects a SUB socket and feeds received envelopes into its
    EventHandler for dispatch.

event_handler:default_queue_size:
  type: int
  default: 100
  description: >-
    Default bounded capacity of the per-event-type dispatch
    queue.  Each event name gets its own queue; when full, the
    overflow policy decides whether to drop oldest, drop newest,
    or block the producer.

event_handler:default_overflow_policy:
  type: enum
  choices: ["drop_oldest", "drop_newest", "block"]
  default: "drop_oldest"
  description: >-
    Default backpressure policy applied when a per-event-type
    dispatch queue is full.  drop_oldest keeps the most recent
    events (recommended for screensaver-style visualizations),
    drop_newest preserves the earliest events, and block
    back-pressures the producer.

event_handler:default_coalesce_ms:
  type: int
  default: 0
  description: >-
    Default coalesce window in milliseconds for batched-delivery
    callbacks.  When greater than zero, envelopes received within
    the window are collected and delivered as a single list to
    callbacks registered via register_batch_callback.

event_handler:default_throttle_ms:
  type: int
  default: 0
  description: >-
    Default trailing-edge throttle window in milliseconds.  When
    greater than zero, envelopes that arrive less than this many
    milliseconds after the previous dispatch of the same event
    type are dropped.

event_handler:worker_join_timeout_ms:
  type: int
  default: 2000
  description: >-
    Maximum total time in milliseconds EventHandler.shutdown()
    waits for worker threads to drain their queues before
    giving up.

event_handler:reconnect_backoff_ms_min:
  type: int
  default: 250
  description: >-
    Minimum reconnect delay in milliseconds used by
    ZMQEventHandlerSource after a recv error.  The actual backoff
    doubles on each failure up to reconnect_backoff_ms_max.

event_handler:reconnect_backoff_ms_max:
  type: int
  default: 8000
  description: >-
    Maximum reconnect delay in milliseconds (cap of exponential
    backoff) used by ZMQEventHandlerSource after a recv error.

event_handler:logging_handler_min_level:
  type: str
  default: "WARNING"
  description: >-
    Minimum Python logging level name (DEBUG/INFO/WARNING/ERROR/
    CRITICAL) that ZMQEventLoggingHandler will forward as
    log.* envelopes.  Levels below this are ignored to avoid
    flooding the event bus.

# ---------------------------------------------------------------------------
# Live Mode Screensaver
# ---------------------------------------------------------------------------

gui:livemode:colormap:
  type: enum
  choices: [viridis, plasma, inferno, magma, jet, bone, hot, cool, grayscale]
  default: jet
  description: >-
    Colormap used for all cluster thumbnails in the Live Mode
    screensaver.

gui:livemode:grid_columns:
  type: int
  default: 16
  description: >-
    Number of columns in the Live Mode thumbnail grid.
    rows x columns must be between 20 and 2000.

gui:livemode:grid_rows:
  type: int
  default: 12
  description: >-
    Number of rows in the Live Mode thumbnail grid.
    rows x columns must be between 20 and 2000.

gui:livemode:grid_spacing_px:
  type: int
  default: 6
  description: >-
    Pixel spacing between thumbnail cells in the grid.
    Minimum enforced: 6.

gui:livemode:advance_interval_ms:
  type: int
  default: 3000
  description: >-
    Milliseconds between each grid advance step (featured
    cluster swap).

gui:livemode:animation_duration_ms:
  type: int
  default: 250
  description: >-
    Duration in milliseconds of the snake-shift displacement
    animation.  Capped at 1000 ms.

gui:livemode:left_panel_width_pct:
  type: float
  default: 0.25
  description: >-
    Width of the left detail panel as a fraction of screen width
    (0.1–0.5).  Default: 0.25 (25%).

gui:livemode:histogram_min_height_pct:
  type: float
  default: 0.10
  description: >-
    Minimum height of the energy histogram as a fraction of
    screen height (0.05–0.5).  Default: 0.10 (10%).

gui:livemode:badges:classifiers_enabled:
  type: bool
  default: true
  description: >-
    Show particle symbol and confidence % badges on Live Mode grid
    thumbnails. When false, only the Energy (keV) badge is rendered.
    Disable for exposures where the trained classifiers are not
    appropriate. The keV badge is always rendered regardless of this
    setting and is also hidden per-cell when the cluster's best
    classifier score is non-positive.

gui:livemode:badges:min_cell_size_px:
  type: int
  default: 48
  description: >-
    Minimum rendered cell side (in pixels) at which Live Mode grid
    badges are drawn. At denser grids cells become too small for
    legible badges and all badges (including keV) are suppressed.

gui:livemode:controls:enabled:
  type: bool
  default: true
  description: >-
    Show the translucent control strip overlay inside the Live Mode
    screensaver.  When false, only Esc dismisses the view.

gui:livemode:controls:autohide_ms:
  type: int
  default: 3000
  description: >-
    Milliseconds of cursor inactivity before the control strip
    auto-hides.  The strip reappears when the cursor moves near
    the top of the screen.

gui:livemode:controls:background_opacity:
  type: float
  default: 0.80
  description: >-
    Alpha (0.0–1.0) of the translucent control strip background.

gui:livemode:controls:icon_size_pct:
  type: float
  default: 3.0
  description: >-
    Control strip icon size as a percentage of screen height.
    A floor of 24 px is enforced so icons never become unreadably
    small on unusual displays.

# ---------------------------------------------------------------------------
# Classifier Service
# ---------------------------------------------------------------------------

classifier:classifier_ipc:
  type: str
  default: "ipc:///tmp/EPCClassifierRequest.ipc"
  description: >-
    ZMQ IPC address for the classifier service requests.

classifier:command_ipc:
  type: str
  default: "ipc:///tmp/EPCClassifierCommand.ipc"
  description: >-
    ZMQ IPC address for the classifier service commands.
