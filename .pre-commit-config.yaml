repos:
  - repo: local
    hooks:
      - id: autopep8
        name: autopep8 (auto-format)
        language: system
        entry: uv run autopep8
        types: [python]
        pass_filenames: true

      - id: docformatter
        name: docformatter (Google-style docstrings)
        language: system
        entry: uv run docformatter
        types: [python]
        pass_filenames: true

      - id: flake8
        name: flake8 lint (diff-scoped)
        language: system
        entry: uv run flake8
        types: [python]
        pass_filenames: true
